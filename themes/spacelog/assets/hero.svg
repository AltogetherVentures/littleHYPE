<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" fill="none">
  <defs>
    <radialGradient id="planet" cx="34%" cy="28%" r="85%">
      <stop offset="0" stop-color="#d8ccff"/><stop offset=".45" stop-color="#7654e0"/><stop offset="1" stop-color="#160c47"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5fe3e8" stop-opacity=".35"/><stop offset="1" stop-color="#5fe3e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#e9f3ff"/><stop offset="1" stop-color="#5c6fa8"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fe3e8" stop-opacity=".15"/><stop offset=".5" stop-color="#9df3f5"/><stop offset="1" stop-color="#5fe3e8" stop-opacity=".2"/>
    </linearGradient>
    <clipPath id="lower"><rect x="0" y="158" width="480" height="142"/></clipPath>
    <style>
      .tw { animation: tw 3.2s ease-in-out infinite; }
      .tw2 { animation: tw 4.6s ease-in-out infinite .9s; }
      .tw3 { animation: tw 2.6s ease-in-out infinite 1.7s; }
      @keyframes tw { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
      .spin { transform-origin: 108px 218px; animation: spin 40s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }
    </style>
  </defs>

  <!-- stars -->
  <g fill="#e8edff">
    <circle class="tw" cx="30" cy="34" r="1.6"/><circle class="tw2" cx="86" cy="18" r="1.1"/><circle cx="140" cy="44" r="1"/>
    <circle class="tw3" cx="210" cy="24" r="1.7"/><circle cx="262" cy="52" r="1"/><circle class="tw2" cx="318" cy="20" r="1.4"/>
    <circle cx="392" cy="38" r="1"/><circle class="tw" cx="446" cy="26" r="1.7"/><circle cx="462" cy="88" r="1"/>
    <circle class="tw3" cx="24" cy="120" r="1.2"/><circle cx="60" cy="168" r="1"/><circle class="tw" cx="180" cy="128" r="1.3"/>
    <circle cx="236" cy="96" r="1"/><circle class="tw2" cx="420" cy="132" r="1.2"/><circle cx="454" cy="196" r="1"/>
    <circle class="tw3" cx="30" cy="262" r="1.5"/><circle cx="196" cy="276" r="1"/><circle class="tw" cx="286" cy="284" r="1.3"/>
    <circle cx="410" cy="272" r="1"/><circle class="tw2" cx="120" cy="92" r="1"/>
  </g>

  <!-- HUD reticle -->
  <g class="spin" stroke="#5fe3e8" stroke-opacity=".55" stroke-width="1.2">
    <circle cx="108" cy="218" r="46" stroke-dasharray="3 6"/>
    <circle cx="108" cy="218" r="30" stroke-opacity=".35"/>
    <path d="M108 164v16M108 256v16M54 218h16M146 218h16"/>
  </g>
  <circle cx="108" cy="218" r="3" fill="#5fe3e8"/>
  <path d="M74 190l-10-10M142 190l10-10M74 246l-10 10M142 246l10 10" stroke="#5fe3e8" stroke-opacity=".4" stroke-width="1.2"/>

  <!-- distant moon -->
  <circle cx="176" cy="78" r="17" fill="url(#moon)"/>
  <circle cx="171" cy="73" r="3.2" fill="#7b8dc4" opacity=".55"/>
  <circle cx="182" cy="84" r="2.2" fill="#7b8dc4" opacity=".5"/>

  <!-- planet system -->
  <circle cx="318" cy="158" r="120" fill="url(#halo)"/>
  <g transform="rotate(-18 318 158)">
    <ellipse cx="318" cy="158" rx="116" ry="27" stroke="url(#ring)" stroke-width="7"/>
    <ellipse cx="318" cy="158" rx="134" ry="33" stroke="#5fe3e8" stroke-opacity=".25" stroke-width="1.2" stroke-dasharray="2 7"/>
  </g>
  <circle cx="318" cy="158" r="66" fill="url(#planet)"/>
  <path d="M262 132q46 18 112 0M254 154q56 22 128 2M266 180q48 16 104-2" stroke="#b9a7ff" stroke-opacity=".28" stroke-width="5" stroke-linecap="round"/>
  <g transform="rotate(-18 318 158)" clip-path="url(#lower)">
    <ellipse cx="318" cy="158" rx="116" ry="27" stroke="url(#ring)" stroke-width="7"/>
  </g>

  <!-- orbiting ship -->
  <g transform="rotate(-18 318 158)">
    <path id="orbit" d="M470 158A152 56 0 1 1 166 158A152 56 0 1 1 470 158" stroke="#5fe3e8" stroke-opacity=".5" stroke-width="1.3" stroke-dasharray="5 6"/>
    <g>
      <path d="M0-6 12 0 0 6 3 0z" fill="#e8edff"/>
      <circle cx="-3" cy="0" r="2.4" fill="#5fe3e8"/>
      <animateMotion dur="16s" repeatCount="indefinite" rotate="auto"><mpath href="#orbit"/></animateMotion>
    </g>
  </g>
</svg>
