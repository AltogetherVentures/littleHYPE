<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#5b4b2a" flood-opacity=".22"/>
    </filter>
    <pattern id="washi" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f3d36b"/><rect width="5" height="10" fill="#f7e08f"/>
    </pattern>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ecd0a2"/><stop offset="1" stop-color="#d9b47c"/></linearGradient>
    <style>
      .wob { transform-origin: 118px 76px; animation: wob 5s ease-in-out infinite; }
      @keyframes wob { 0%,100% { transform: rotate(-9deg) } 50% { transform: rotate(-5deg) } }
    </style>
  </defs>

  <!-- warm desk rings -->
  <circle cx="404" cy="236" r="34" stroke="#c9a877" stroke-opacity=".28" stroke-width="5"/>

  <!-- the page -->
  <g transform="rotate(-3.5 226 152)" filter="url(#shadow)">
    <rect x="96" y="22" width="248" height="262" rx="7" fill="#fffdf5" stroke="#dccfae" stroke-width="1.5"/>
    <g stroke="#c9d6ec" stroke-width="1.3">
      <path d="M96 66h248M96 92h248M96 118h248M96 144h248M96 170h248M96 196h248M96 222h248M96 248h248"/>
    </g>
    <path d="M132 22v262" stroke="#e58b8b" stroke-width="1.6"/>
    <g fill="#f0e7d0" stroke="#dccfae"><circle cx="112" cy="70" r="5"/><circle cx="112" cy="152" r="5"/><circle cx="112" cy="234" r="5"/></g>

    <!-- handwriting -->
    <path d="M150 52q6-14 12 0t12 0 12 0 12 0 12 0 12 0" stroke="#1d2946" stroke-width="3"/>
    <path d="M150 88q10-6 20 0t20 0 20 0 20 0 20 0 14 0" stroke="#1d2946" stroke-width="2" stroke-opacity=".8"/>
    <path d="M150 114q8-6 16 0t16 0 16 0 16 0 16 0 16 0 12 0" stroke="#1d2946" stroke-width="2" stroke-opacity=".8"/>
    <path d="M150 140q12-6 24 0t24 0 24 0 24 0 16 0" stroke="#1d2946" stroke-width="2" stroke-opacity=".8"/>
    <path d="M150 192q9-6 18 0t18 0 18 0 18 0 18 0 10 0" stroke="#1d2946" stroke-width="2" stroke-opacity=".8"/>
    <path d="M150 218q10-6 20 0t20 0 20 0 20 0" stroke="#1d2946" stroke-width="2" stroke-opacity=".8"/>
    <!-- ticks -->
    <path d="m148 160 7 8 14-18" stroke="#c23b32" stroke-width="3.2"/>
    <path d="m148 236 7 8 14-18" stroke="#c23b32" stroke-width="3.2"/>
    <path d="M186 172q40-6 110 0" stroke="#c23b32" stroke-width="2" stroke-opacity=".7"/>
    <!-- squiggle underline -->
    <path d="M150 66q12 6 24 0t24 0 24 0 24 0" stroke="#c23b32" stroke-width="2.4"/>
  </g>

  <!-- washi tape -->
  <g>
    <rect x="86" y="18" width="68" height="20" fill="url(#washi)" opacity=".9" transform="rotate(-24 120 28)"/>
    <rect x="292" y="26" width="64" height="20" fill="url(#washi)" opacity=".9" transform="rotate(20 324 36)"/>
  </g>

  <!-- bookmark ribbon -->
  <path d="M262 8v122l16-14 16 14V8z" fill="#c23b32"/>
  <path d="M270 8v112" stroke="#e77a70" stroke-width="2" stroke-opacity=".6"/>

  <!-- stickers -->
  <g transform="rotate(-12 82 108)">
    <path d="m82 70 9.6 19.8 21.8 3-15.9 15.2 3.9 21.7L82 119.3l-19.4 10.4 3.9-21.7-15.9-15.2 21.8-3z" fill="#f6c945" stroke="#fffdf5" stroke-width="5" paint-order="stroke"/>
  </g>
  <g transform="rotate(10 412 92)">
    <circle cx="412" cy="92" r="26" fill="#c23b32" stroke="#fffdf5" stroke-width="5" paint-order="stroke"/>
    <path d="m401 92 8 9 15-19" stroke="#fffdf5" stroke-width="5"/>
  </g>

  <!-- pencil -->
  <g transform="translate(-4 -34) rotate(-38 386 218)">
    <rect x="286" y="207" width="120" height="22" fill="#f4c542"/>
    <rect x="286" y="207" width="120" height="6" fill="#f9dc7a"/>
    <rect x="286" y="223" width="120" height="6" fill="#d9a72a"/>
    <rect x="404" y="205" width="16" height="26" fill="#b9bcc6"/>
    <path d="M404 209h16M404 214h16M404 219h16M404 224h16" stroke="#8e91a0" stroke-width="1.2"/>
    <rect x="420" y="207" width="16" height="22" rx="5" fill="#eb8e8e"/>
    <path d="M286 207v22l-44-11z" fill="url(#wood)"/>
    <path d="M254 214.5l-12 3.5 12 3.5z" fill="#3b3b40"/>
  </g>
</svg>
