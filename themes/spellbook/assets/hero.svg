<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd76a" stop-opacity=".75"/><stop offset=".5" stop-color="#e8a83a" stop-opacity=".22"/><stop offset="1" stop-color="#e8a83a" stop-opacity="0"/></radialGradient>
    <linearGradient id="pageL" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#e9d6a8"/><stop offset=".25" stop-color="#f8eccb"/><stop offset="1" stop-color="#f3e3ba"/></linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9d6a8"/><stop offset=".25" stop-color="#f8eccb"/><stop offset="1" stop-color="#f3e3ba"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c0b2b"/><stop offset=".6" stop-color="#3d1030"/><stop offset="1" stop-color="#5a1428"/></linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a1f3d"/><stop offset="1" stop-color="#4a0f25"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#3a1322" flood-opacity=".35"/></filter>
    <path id="spark" d="M0-9C1.5-2.5 2.5-1.5 9 0 2.5 1.5 1.5 2.5 0 9-1.5 2.5-2.5 1.5-9 0-2.5-1.5-1.5-2.5 0-9z"/>
    <style>
      .tw { animation: tw 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .tw2 { animation: tw 3.6s ease-in-out infinite .8s; transform-box: fill-box; transform-origin: center; }
      .tw3 { animation: tw 4.4s ease-in-out infinite 1.6s; transform-box: fill-box; transform-origin: center; }
      @keyframes tw { 0%,100% { opacity: .2; transform: scale(.6) } 50% { opacity: 1; transform: scale(1.1) } }
      .pulse { animation: pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: .7; transform: scale(.94) } 50% { opacity: 1; transform: scale(1.06) } }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    </style>
  </defs>

  <!-- framed night-sky plate -->
  <rect x="10" y="8" width="460" height="284" rx="20" fill="url(#night)"/>
  <rect x="10" y="8" width="460" height="284" rx="20" stroke="#c9962e" stroke-width="2.4"/>
  <rect x="18" y="16" width="444" height="268" rx="14" stroke="#c9962e" stroke-opacity=".45" stroke-width="1"/>
  <g fill="#f5e6b8"><circle cx="40" cy="60" r="1.2" opacity=".7"/><circle cx="72" cy="30" r="1" opacity=".5"/><circle cx="436" cy="44" r="1.3" opacity=".7"/><circle cx="452" cy="120" r="1" opacity=".5"/><circle cx="34" cy="150" r="1" opacity=".5"/><circle cx="420" cy="230" r="1.2" opacity=".6"/><circle cx="56" cy="240" r="1" opacity=".5"/><circle cx="380" cy="50" r="1" opacity=".5"/></g>

  <!-- candle glow behind the book -->
  <ellipse cx="240" cy="120" rx="190" ry="120" fill="url(#glow)" class="pulse"/>

  <!-- moon phases: new, crescent, half, full, half, crescent, new -->
  <g transform="translate(120 40)" stroke="#c9962e" stroke-width="1.3">
    <g fill="#2b0f22"><circle cx="0" cy="0" r="9"/><circle cx="48" cy="-4" r="9"/><circle cx="96" cy="-7" r="9"/><circle cx="192" cy="-7" r="9"/><circle cx="240" cy="-4" r="9"/><circle cx="288" cy="0" r="9"/></g>
    <circle cx="144" cy="-8" r="9" fill="#f5e6b8"/>
    <g fill="#f5e6b8" stroke="none">
      <path d="M48-13a9 9 0 0 1 0 18a4 9 0 0 0 0-18z"/>
      <path d="M96-16a9 9 0 0 1 0 18z"/>
      <path d="M192-16a9 9 0 0 0 0 18z"/>
      <path d="M240-13a9 9 0 0 0 0 18a4 9 0 0 1 0-18z"/>
    </g>
  </g>

  <!-- the book -->
  <g filter="url(#soft)">
    <path d="M60 196 240 228 420 196V236L240 268 60 236z" fill="url(#cover)"/>
    <path d="M60 236 240 268 420 236" stroke="#c9962e" stroke-width="2" stroke-opacity=".8"/>
    <path d="M240 212C205 190 130 186 66 194V232C134 222 206 228 240 250z" fill="url(#pageL)" stroke="#c9b27a" stroke-width="1.4"/>
    <path d="M240 212C275 190 350 186 414 194V232C346 222 274 228 240 250z" fill="url(#pageR)" stroke="#c9b27a" stroke-width="1.4"/>
    <path d="M240 212V250" stroke="#b39a5e" stroke-width="2"/>
    <!-- page lines / runes -->
    <g stroke="#9a7a3c" stroke-opacity=".55" stroke-width="1.6">
      <path d="M96 202q40-4 108 8M96 212q40-4 108 8M96 222q40-4 96 6"/>
      <path d="M384 202q-40-4-108 8M384 212q-40-4-108 8M384 222q-40-4-96 6"/>
    </g>
  </g>

  <!-- floating sigil above the book -->
  <g class="float">
    <g class="pulse">
      <circle cx="240" cy="142" r="44" stroke="#ffd76a" stroke-width="2.6"/>
      <circle cx="240" cy="142" r="36" stroke="#ffd76a" stroke-width="1.2" stroke-dasharray="3 5"/>
      <path d="M240 110l30 32-30 32-30-32z" stroke="#ffe08a" stroke-width="2.2"/>
      <path d="M218 120h44v44h-44z" stroke="#ffe08a" stroke-width="2.2" transform="rotate(0 240 142)"/>
      <circle cx="240" cy="142" r="6" fill="#fff3c8"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#ffd76a">
    <use href="#spark" class="tw" x="94" y="112"/><use href="#spark" class="tw2" x="392" y="96" transform="translate(0 0) scale(1.2)" />
    <use href="#spark" class="tw3" x="160" y="70"/><use href="#spark" class="tw" x="336" y="72"/>
    <use href="#spark" class="tw2" x="60" y="180"/><use href="#spark" class="tw3" x="424" y="170"/>
    <use href="#spark" class="tw" x="300" y="112"/><use href="#spark" class="tw2" x="184" y="118"/>
  </g>
</svg>
